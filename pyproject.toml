[project]
name = "bdc-data-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiokafka>=0.12,<0.15",
  "google-cloud-bigquery>=3.46,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
asyncio_mode = "auto"
testpaths = ["tests"]
