name: Warehouse contract and recovery tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: python scripts/warehouse.py render > /dev/null
